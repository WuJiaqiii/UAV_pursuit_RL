simulation_backend: torch
device: auto
# True 1 kHz policy: fresh CTBR every 1 ms; default simulated plant is not real hardware.
physics:
  dt: 0.001
  substeps: 1
  policy_interval_steps: 1
evaluation:
  trace_stride: 20
training:
  n_steps: 2048
  num_envs: 64
  batch_size: 2048
  epochs: 3
  gamma: 0.9999799901935271
  gae_lambda: 0.9989746601327679
  total_steps: 50000000
  initial_stage: 5
  max_stage: 5
  eval_every: 6553600
  eval_episodes: 8
  min_stage_steps: 13107200
  actor_lr: 0.0001
  critic_lr: 0.0003
  log_std_init: -1.3
