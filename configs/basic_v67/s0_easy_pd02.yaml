# V6.7: true 1kHz CTBR + GPU-resident rollout, teacher only in PPO loss.
# Training task = FIRST ENTRANCE into capture radius, not continuous follow.
extends: ../basic/basic_stage0_1khz.yaml
seed: 42
training:
  initial_stage: 0
  max_stage: 0
  num_envs: 64
  n_steps: 2048
  batch_size: 4096
  epochs: 3
  total_steps: 20000000
  eval_every: 4194304
  eval_episodes: 32
  eval_seed: 78000
  actor_lr: 0.00005
  critic_lr: 0.0001
  clip: 0.15
  target_kl: 0.015
  aux_pd_coef: 0.2
  aux_pd_schedule: constant
  aux_pd_decay_steps: 40000000
  challenge_eval_enabled: false
reward:
  w_progress: 8.0
  progress_scale_m: 20.0
  w_action_delta: 0.0
stages:
  stage0:
    distance: [10.0, 15.0]
    speed: [0.0, 2.0]
    time: 20.0
    max_accel: 2.0
    success_radius: 5.0
