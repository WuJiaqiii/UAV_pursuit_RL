[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pursuit-rl"
dynamic = ["version"]
description = "Sustained flight and random maneuver pursuit with direct CTBR PPO"
requires-python = ">=3.10"
dependencies = ["numpy>=1.25,<3", "torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24"]

[project.scripts]
pursuit = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.dynamic]
version = {attr = "pursuit_rl.__version__"}

[tool.setuptools.packages.find]
include = ["pursuit_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
target-version = ["py310"]
line-length = 88
